name: Scalp Swing Scanner

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: scalp-swing-scanner
  cancel-in-progress: false   # queue new triggers instead of running in parallel;
                              # cancelling mid-flight risks a half-written state.json

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync state files with latest on origin
        # Must happen BEFORE the scanner runs and touches state.json /
        # candle_cache.json, while the tree is still clean. Doing this
        # after the run (as before) meant `git pull --rebase` was always
        # run against a dirty tree and always failed -- silently, because
        # of the old `|| true`. That failure meant the cache never
        # reliably round-tripped, so every run was effectively a cold
        # start (~20 min of rate-limit pacing alone for 25 symbols),
        # which is why every run blew past any timeout.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }}

      - name: Run signal scanner
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
        run: python signal_engine.py

      - name: Persist cooldown state
        if: always()
        run: |
          git add state.json candle_cache.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update scanner state [skip ci]"
            git push
          fi
